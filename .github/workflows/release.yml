name: Release

# Pushing a tag like v1.0 builds the Android APK and publishes it on the GitHub release page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

      # Optional: sign with the team key (Settings > Secrets and variables > Actions).
      # Without these secrets the APK is signed with a debug key: fine to install, not for the Play Store.
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Signing with the team key."
          else
            echo "No signing secrets: debug key."
          fi

      # API_URL: Settings > Secrets and variables > Actions > Variables, e.g. https://phishguard-server.onrender.com
      - name: Build the APK
        run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL }}

      - name: Rename the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "PhishGuard-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: app/PhishGuard-${{ github.ref_name }}.apk
          generate_release_notes: true
